version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: teaching-mongodb
    restart: always
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: pass
      MONGO_INITDB_DATABASE: teaching_platform
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
